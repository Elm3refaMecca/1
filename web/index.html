<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <meta name="google-signin-client_id" content="773233380314-t7nsjeim41v50fct8794k0rn9dm8do83.apps.googleusercontent.com">
  <meta name="description" content="موقع مدرسة المعرفة الأهلية بمكة المكرمة (القسم الابتدائي).">
  <meta name="keywords" content="المعرفة الاهلية, مدرسة المعرفة الاهلية بمكة, المعرفة, ابتدائية المعرفة الاهلية, ابتدائية المعرفة, مدارس المعرفة, مجمع المعرفة">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ابتدائية المعرفة بمكة المكرمة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ابتدائية المعرفة الأهلية بمكة المكرمة</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <script>
    if ('serviceWorker' in navigator && !localStorage.getItem('sw_kill_switch_applied_v3')) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        if (registrations.length > 0) {
          console.log('Found old service workers. Unregistering...');
          var unregisterPromises = [];
          for (let registration of registrations) {
            unregisterPromises.push(
              registration.unregister().then(function(success) {
                console.log('Unregistered service worker:', registration.scope, success);
              }).catch(function(error) {
                console.error('Failed to unregister service worker:', error);
              })
            );
          }
          Promise.allSettled(unregisterPromises).then(() => {
            console.log('All old service workers unregistered. Setting flag and reloading.');
            localStorage.setItem('sw_kill_switch_applied_v3', 'true');
            window.location.reload(true); 
          });
        } else {
          localStorage.setItem('sw_kill_switch_applied_v3', 'true');
          console.log('No old service workers found. Setting flag.');
        }
      }).catch(function(error) {
        console.error('Error during service worker kill switch:', error);
        localStorage.setItem('sw_kill_switch_applied_v3', 'true');
      });
    }
  </script>
  <style>
    body {
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loader-container {
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #ffffff; 
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }
    lottie-player {
      width: 300px;
      height: 300px;
      max-width: 80%;
    }
    #loading-text {
      margin-top: 10px;
      color: #1976D2; 
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader-container">
    <lottie-player 
      src="1.json" 
      background="transparent" 
      speed="1" 
      loop 
      autoplay>
    </lottie-player>
    <div id="loading-text">جاري فتح المنصة...</div>
  </div>

  <script>
    // دالة لإخفاء شاشة الانتظار
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 500);
      }
    }

    // دالة جديدة لإظهار شاشة الانتظار وتغيير النص (تستخدم عند تسجيل الدخول)
    window.showLoaderWithText = function(text) {
      var loader = document.getElementById('loader');
      var textElement = document.getElementById('loading-text');
      
      if (textElement) {
        textElement.innerText = text;
      }
      
      if (loader) {
        loader.style.display = 'flex';
        // مهلة بسيطة لضمان تطبيق العرض قبل تغيير الشفافية
        setTimeout(function() {
          loader.style.opacity = '1';
        }, 10);
      }
    };

    // مراقب ذكي يكتشف متى يبدأ تطبيق Flutter بالرسم على الشاشة
    const observer = new MutationObserver((mutationsList, observer) => {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('canvas')) {
            hideLoader();
            observer.disconnect(); 
        }
    });
    
    observer.observe(document.body, { childList: true, subtree: true });

    // أمان إضافي
    setTimeout(hideLoader, 15000);

    let deferredPrompt;
    window.isInstallable = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.isInstallable = true;
      window.dispatchEvent(new CustomEvent('pwa-installable'));
    });

    function showInstallPrompt() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the A2HS prompt');
          } else {
            console.log('User dismissed the A2HS prompt');
          }
          deferredPrompt = null;
          window.isInstallable = false;
          window.dispatchEvent(new CustomEvent('pwa-installable'));
        });
      }
    }

    // تسجيل ملف Firebase Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js').then(function (registration) {
          console.log('Firebase MS SW registered: ', registration);
        }).catch(function (err) {
          console.log('Firebase MS SW registration failed: ', err);
        });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" data-service-worker-version="none" async></script>
</body>
</html>
