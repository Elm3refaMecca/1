<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <meta name="description" content="موقع مدرسة المعرفة الأهلية بمكة المكرمة (القسم الابتدائي).">
  <meta name="keywords" content="المعرفة الاهلية, مدرسة المعرفة الاهلية بمكة, المعرفة, ابتدائية المعرفة الاهلية, ابتدائية المعرفة, مدارس المعرفة, مجمع المعرفة">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ابتدائية المعرفة">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ابتدائية المعرفة الأهلية بمكة المكرمة</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <script>
    if ('serviceWorker' in navigator && !localStorage.getItem('sw_kill_switch_applied_v3')) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        if (registrations.length > 0) {
          console.log('Found old service workers. Unregistering...');
          var unregisterPromises = [];
          for (let registration of registrations) {
            unregisterPromises.push(
              registration.unregister().then(function(success) {
                console.log('Unregistered service worker:', registration.scope, success);
              }).catch(function(error) {
                console.error('Failed to unregister service worker:', error);
              })
            );
          }
          Promise.allSettled(unregisterPromises).then(() => {
            console.log('All old service workers unregistered. Setting flag and reloading.');
            localStorage.setItem('sw_kill_switch_applied_v3', 'true');
            window.location.reload(true);
          });
        } else {
          localStorage.setItem('sw_kill_switch_applied_v3', 'true');
          console.log('No old service workers found. Setting flag.');
        }
      }).catch(function(error) {
        console.error('Error during service worker kill switch:', error);
        localStorage.setItem('sw_kill_switch_applied_v3', 'true');
      });
    }
  </script>

  <style>
    body {
      background-color: #FFFFFF; /* خلفية بيضاء لتتطابق مع اللوتي */
      margin: 0;
      padding: 0;
      overflow: hidden; /* منع التمرير أثناء التحميل */
    }
    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #FFFFFF; /* تغطية كاملة */
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }
    lottie-player {
      width: 300px;
      height: 300px;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader-container">
    <lottie-player 
      src="1.json" 
      background="transparent" 
      speed="1" 
      loop 
      autoplay>
    </lottie-player>
  </div>

  <script>
    // دالة إخفاء شاشة الانتظار
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 500);
      }
    }

    // مراقب لاكتشاف متى ينتهي فلاتر من التحميل لإخفاء اللوتي
    const observer = new MutationObserver((mutationsList, observer) => {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('canvas')) {
            hideLoader();
            observer.disconnect();
        }
    });
    
    observer.observe(document.body, { childList: true, subtree: true });
    
    // أمان: إخفاء اللوتي بعد 15 ثانية في حال حدوث خطأ
    setTimeout(hideLoader, 15000);

    // كود تثبيت التطبيق PWA
    let deferredPrompt;
    window.isInstallable = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.isInstallable = true;
      window.dispatchEvent(new CustomEvent('pwa-installable'));
    });

    function showInstallPrompt() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the A2HS prompt');
          }
          deferredPrompt = null;
          window.isInstallable = false;
          window.dispatchEvent(new CustomEvent('pwa-installable'));
        });
      }
    }

    // تسجيل Service Worker للإشعارات
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js');
      });
    }
  </script>

  <script>
    // 1. عند تحميل الصفحة، نضيف "حالة وهمية" لتاريخ المتصفح
    window.addEventListener('load', function() {
      window.history.pushState({ noBack: true }, "");
    });

    // 2. عندما يضغط المستخدم زر الرجوع (popstate event)
    window.addEventListener('popstate', function(event) {
      // نعيد إضافة الحالة الوهمية فوراً لنمنع المتصفح من الخروج
      window.history.pushState({ noBack: true }, "");
      
      // هذا الإجراء يجعل المتصفح "يبقى" في مكانه،
      // وفي نفس الوقت يلتقط Flutter الحدث ويظهر القائمة المنبثقة التي برمجناها في main.dart
    });
  </script>

<script>
  window.flutterConfiguration = {
    renderer: "html"
  };
</script>

<script src="flutter_bootstrap.js" data-service-worker-version="none" async></script></body>
</html>
